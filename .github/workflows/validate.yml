name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check generated modules
        run: python3 tools/build.py --check
      - name: Validate module syntax and policy
        run: python3 tools/validate.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Test JavaScript runtimes
        run: node --test tests/runtime.test.js
      - name: Audit runtime hashes and pinned commits
        run: python3 tools/audit_scripts.py --local-only
